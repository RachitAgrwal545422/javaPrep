<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Java Collections — Interactive Hierarchy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap');

:root {
  --bg: #080b14;
  --surface: #0e1320;
  --panel-bg: #0a0e1a;
  --border: #1a2035;
  --I: #00c6ff;
  --A: #ff7c40;
  --C: #3ddc84;
  --L: #b98fff;
  --ext: #ffd166;
  --imp: #ff6b9d;
  --text: #c8d3e8;
  --muted: #3d4f6e;
  --card: #111827;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
}

/* ── Header ── */
#hdr {
  position: fixed; top:0; left:0; right:0; z-index:300;
  height: 50px;
  background: rgba(8,11,20,0.97);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 1.5rem; padding: 0 1.2rem;
}
#hdr h1 {
  font-family: 'Syne', sans-serif;
  font-size: 1rem; font-weight: 800;
  background: linear-gradient(90deg, var(--I), var(--C));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  white-space: nowrap;
}
.leg { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
.li  { display:flex; align-items:center; gap:5px; font-size:0.58rem; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }
.lb  { width:9px; height:9px; border-radius:2px; border:1.5px solid; }
.lline { width:22px; height:2px; }

.ctrl { margin-left:auto; display:flex; gap:6px; }
.btn {
  background: var(--surface); border:1px solid var(--border);
  color:var(--text); font-family:'IBM Plex Mono',monospace;
  font-size:0.58rem; padding:4px 10px; border-radius:4px; cursor:pointer;
  transition:.15s;
}
.btn:hover { border-color:var(--I); color:var(--I); }

/* ── Canvas ── */
#wrap {
  position: fixed; top:50px; left:0; right:0; bottom:0;
  overflow: hidden;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,198,255,0.03) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(61,220,132,0.03) 0%, transparent 50%),
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
  cursor: default;
}
#wrap.panning { cursor: grab; }

#world { position:absolute; transform-origin:0 0; }

/* ── SVG edges ── */
#svg-edges {
  position:absolute; top:0; left:0;
  pointer-events:none; overflow:visible;
}

/* ── Nodes ── */
.node {
  position: absolute;
  border-radius: 8px;
  border: 1.5px solid;
  cursor: grab;
  z-index: 10;
  transition: box-shadow .2s;
  min-width: 148px;
}
.node:active { cursor: grabbing; z-index: 50; }
.node.dragging { z-index: 50; }

.node-head {
  padding: 7px 10px 5px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; flex-direction: column; gap: 2px;
}
.node-kind { font-size:.48rem; opacity:.6; letter-spacing:.08em; text-transform:uppercase; }
.node-name { font-size:.68rem; font-weight:600; line-height:1.2; }
.node-pkg  { font-size:.5rem; opacity:.5; }

.node-body {
  padding: 6px 10px 8px;
  font-size: .55rem;
  line-height: 1.55;
  color: #8a99b8;
  max-width: 220px;
}
.node-body .tag {
  display: inline-block;
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
  padding: 0 4px;
  margin: 1px 0;
  color: #aab4cc;
}
.node-body .q { color: #ffd166; font-size:.5rem; margin-top:4px; display:block; }

/* Type colours */
.tI { border-color:var(--I); }
.tI .node-head { background: rgba(0,198,255,0.06); }
.tI .node-name { color: var(--I); }
.tI:hover { box-shadow: 0 0 18px rgba(0,198,255,0.25); }

.tA { border-color:var(--A); }
.tA .node-head { background: rgba(255,124,64,0.06); }
.tA .node-name { color: var(--A); }
.tA:hover { box-shadow: 0 0 18px rgba(255,124,64,0.25); }

.tC { border-color:var(--C); }
.tC .node-head { background: rgba(61,220,132,0.06); }
.tC .node-name { color: var(--C); }
.tC:hover { box-shadow: 0 0 18px rgba(61,220,132,0.25); }

.tL { border-color:var(--L); }
.tL .node-head { background: rgba(185,143,255,0.06); }
.tL .node-name { color: var(--L); }
.tL:hover { box-shadow: 0 0 18px rgba(185,143,255,0.25); }

/* ── Info panel (click) ── */
#info-panel {
  position: fixed; right:0; top:50px; bottom:0;
  width: 340px;
  background: var(--panel-bg);
  border-left: 1px solid var(--border);
  z-index: 400;
  transform: translateX(100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  overflow-y: auto;
  padding: 1.2rem;
}
#info-panel.open { transform: translateX(0); }
#info-panel h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem; font-weight: 800;
  margin-bottom: 3px;
}
#info-panel .pkg { font-size:.6rem; color:var(--muted); margin-bottom:12px; }
.info-section { margin-bottom:14px; }
.info-section h3 {
  font-size:.62rem; font-weight:600; text-transform:uppercase;
  letter-spacing:.1em; color:var(--muted);
  margin-bottom:5px; padding-bottom:4px;
  border-bottom:1px solid var(--border);
}
.info-section p, .info-section li {
  font-size:.62rem; line-height:1.65; color:#8a99b8;
}
.info-section ul { padding-left:14px; }
.info-section li { margin:2px 0; }
.info-section code {
  background:rgba(255,255,255,0.05);
  padding:1px 5px; border-radius:3px;
  color:#b0bdd4; font-size:.6rem;
}
.info-close {
  position:absolute; top:10px; right:12px;
  background:none; border:none; color:var(--muted);
  font-size:1rem; cursor:pointer; line-height:1;
}
.info-close:hover { color:var(--text); }
.complexity-row {
  display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;
}
.chip {
  font-size:.55rem; padding:2px 7px; border-radius:10px;
  background: rgba(255,255,255,0.05); color:#aab4cc;
  border:1px solid rgba(255,255,255,0.08);
}
.chip.good { border-color:rgba(61,220,132,.4); color:var(--C); }
.chip.warn { border-color:rgba(255,209,102,.4); color:var(--ext); }
.chip.bad  { border-color:rgba(255,107,157,.4); color:var(--imp); }
.interview-q {
  background: rgba(255,209,102,0.05);
  border:1px solid rgba(255,209,102,0.15);
  border-radius:6px; padding:8px 10px; margin-top:6px;
}
.interview-q .qlabel { font-size:.5rem; color:var(--ext); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
.interview-q p { font-size:.6rem; color:#9aa5be; }
</style>
</head>
<body>

<div id="hdr">
  <h1>☕ Java Collections — Interactive Hierarchy</h1>
  <div class="leg">
    <div class="li"><div class="lb" style="border-color:var(--I);background:rgba(0,198,255,.2)"></div>Interface</div>
    <div class="li"><div class="lb" style="border-color:var(--A);background:rgba(255,124,64,.2)"></div>Abstract</div>
    <div class="li"><div class="lb" style="border-color:var(--C);background:rgba(61,220,132,.2)"></div>Concrete</div>
    <div class="li"><div class="lb" style="border-color:var(--L);background:rgba(185,143,255,.2)"></div>Legacy</div>
    <div class="li"><div class="lline" style="background:var(--ext)"></div>extends</div>
    <div class="li"><div class="lline" style="background:var(--imp);background:repeating-linear-gradient(90deg,var(--imp) 0,var(--imp) 5px,transparent 5px,transparent 9px)"></div>implements</div>
  </div>
  <div class="ctrl">
    <button class="btn" onclick="resetView()">⟳ Reset</button>
    <button class="btn" onclick="doZoom(1.15)">＋</button>
    <button class="btn" onclick="doZoom(0.87)">－</button>
  </div>
</div>

<div id="wrap">
  <div id="world">
    <svg id="svg-edges" width="5000" height="3000"></svg>
  </div>
</div>

<!-- Info Panel -->
<div id="info-panel">
  <button class="info-close" onclick="closePanel()">✕</button>
  <div id="panel-content"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  NODE DATA  (id, x, y, type, label, pkg, body, info)
// ══════════════════════════════════════════════════════
const NODE_W = 200; // approximate – real size from DOM

const nodes = [
// ── ROOT ──────────────────────────────────────────────
{id:'Iterable', x:1200, y:30, t:'I',
 label:'Iterable<E>', pkg:'java.lang',
 body:'Enables for-each loop on any object.',
 info:{
  desc:'Root of the entire Java iteration model. Any class implementing Iterable can be used in a for-each loop.',
  methods:['iterator() → Iterator<E>'],
  complexity:[],
  tips:['Introduced in Java 5 with generics','Enhanced for-loop calls iterator() internally','Collections are Iterable, arrays are NOT (they use index)'],
  qs:[{q:'Why does Collection extend Iterable?',a:'So all collections support the enhanced for-each loop automatically via iterator().'}]
 }
},
{id:'Collection', x:1200, y:150, t:'I',
 label:'Collection<E>', pkg:'java.util',
 body:'Root of the collection hierarchy.',
 info:{
  desc:'The fundamental interface for all JCF collections. Represents a group of objects (elements). Does NOT guarantee order or uniqueness.',
  methods:['add(E)','remove(Object)','contains(Object)','size()','isEmpty()','iterator()','toArray()','stream()'],
  complexity:[],
  tips:['Map does NOT extend Collection','Collections class (plural) is a utility, not this interface','Bulk ops: addAll, removeAll, retainAll, clear'],
  qs:[{q:'Difference between Collection and Collections?',a:'Collection (singular) is the interface. Collections (plural) is a utility class with static helper methods like sort(), shuffle(), unmodifiableList().'}]
 }
},
{id:'AbstractCollection', x:1200, y:270, t:'A',
 label:'AbstractCollection<E>', pkg:'java.util',
 body:'Skeletal impl. Only iterator() + size() required.',
 info:{
  desc:'Provides a skeletal implementation of Collection. You only need to implement iterator() and size() to get a working, complete Collection.',
  methods:['Implements all Collection methods using iterator()'],
  tips:['Template Method pattern in action','toString() also provided here','AbstractList, AbstractSet, AbstractQueue all extend this'],
  qs:[{q:'Why use AbstractCollection?',a:'It is an application of the Template Method design pattern — it provides default implementations in terms of iterator() and size(), so subclasses only override what differs.'}]
 }
},

// ── LIST BRANCH ────────────────────────────────────────
{id:'List', x:480, y:150, t:'I',
 label:'List<E>', pkg:'java.util',
 body:'Ordered, allows duplicates. Index-based access.',
 info:{
  desc:'An ordered (sequenced) collection. The user controls where elements are inserted. Allows duplicate elements and multiple null values.',
  methods:['get(int)','set(int, E)','add(int, E)','remove(int)','indexOf(Object)','subList(int,int)','listIterator()'],
  tips:['Guarantees positional order (insertion order preserved)','Allows duplicates — key difference from Set','subList returns a view (backed by original list)'],
  qs:[{q:'List vs Set?',a:'List is ordered and allows duplicates. Set is unordered (except LinkedHashSet/TreeSet) and forbids duplicates.'}]
 }
},
{id:'AbstractList', x:480, y:370, t:'A',
 label:'AbstractList<E>', pkg:'java.util',
 body:'Skeletal List impl for random-access stores.',
 info:{
  desc:'Provides skeletal implementation of List backed by random-access data stores (like arrays). Subclasses only need to implement get(int) and size().',
  methods:['Implements iterator(), listIterator(), indexOf(), subList() etc.'],
  tips:['Use AbstractSequentialList for linked structures instead','Provides fail-fast iterator using modCount field','RandomAccess marker interface often paired with this'],
  qs:[{q:'What is modCount?',a:'A counter incremented on every structural modification. Iterators snapshot it and throw ConcurrentModificationException if it changes — the fail-fast mechanism.'}]
 }
},
{id:'AbstractSeqList', x:200, y:490, t:'A',
 label:'AbstractSequentialList<E>', pkg:'java.util',
 body:'Skeletal List impl for sequential (linked) access.',
 info:{
  desc:'Provides a skeletal List for sequential access. get(int) is implemented via listIterator(index). LinkedList extends this.',
  methods:['Requires only listIterator() and size()'],
  tips:['Opposite of AbstractList: optimised for sequential not random access','Random access is O(n) — must traverse from head/tail','LinkedList is the only JDK class extending this'],
  qs:[{q:'Why is LinkedList slow for random access?',a:'get(i) on LinkedList calls listIterator(i) which traverses node by node — O(n). Use ArrayList when you need fast random access.'}]
 }
},
{id:'ArrayList', x:60, y:620, t:'C',
 label:'ArrayList<E>', pkg:'java.util',
 body:'Resizable array. O(1) get. Not thread-safe.',
 info:{
  desc:'The most commonly used List. Backed by an Object[]. Auto-grows by 50% when capacity is exceeded.',
  methods:['get(int) — O(1)','add(E) — O(1) amortised','add(int,E) — O(n)','remove(int) — O(n)','contains — O(n)'],
  complexity:[{label:'get',cls:'good'},{label:'add-end O(1)*',cls:'good'},{label:'add-mid O(n)',cls:'bad'},{label:'search O(n)',cls:'warn'}],
  tips:['Default capacity = 10; grows to 15, 22, 33…','ensureCapacity() to pre-allocate and avoid copies','trimToSize() to release wasted memory','Implements RandomAccess marker interface'],
  qs:[
    {q:'ArrayList vs LinkedList — when to use?',a:'ArrayList: fast get/iteration, rare inserts. LinkedList: frequent add/remove at ends (queue/deque), rare index access.'},
    {q:'How does ArrayList grow?',a:'When full, it creates a new array at oldCapacity * 1.5 + 1 and copies elements — O(n) occasionally, amortised O(1).'}
  ]
 }
},
{id:'LinkedList', x:280, y:620, t:'C',
 label:'LinkedList<E>', pkg:'java.util',
 body:'Doubly-linked. Implements List + Deque.',
 info:{
  desc:'A doubly-linked list implementing both List and Deque. Each element is a Node with prev/next pointers. Can be used as a stack, queue, or deque.',
  methods:['addFirst/Last — O(1)','removeFirst/Last — O(1)','get(int) — O(n)','contains — O(n)'],
  complexity:[{label:'addFirst/Last O(1)',cls:'good'},{label:'get(i) O(n)',cls:'bad'},{label:'remove O(1)*',cls:'good'}],
  tips:['No RandomAccess — avoid get(i) in loops','Each node takes ~48 bytes overhead — high memory use','peek()/poll() return null (not exceptions) — queue style','push()/pop() work like a stack on the head'],
  qs:[{q:'Why is LinkedList memory-heavy?',a:'Each node stores the element + prev + next references (~48 bytes extra per element vs ~4 bytes in ArrayList). Use only when insert/delete performance matters more.'}]
 }
},
{id:'Vector', x:520, y:490, t:'L',
 label:'Vector<E>', pkg:'java.util',
 body:'Legacy synchronized resizable array.',
 info:{
  desc:'Like ArrayList but every method is synchronized. Part of the original JDK 1.0 before the Collections Framework. Grows by 100% (doubles) instead of 50%.',
  methods:['All ArrayList methods','elementAt(int) (legacy alias for get)'],
  complexity:[],
  tips:['Synchronised = slower than ArrayList even in single-threaded code','Prefer Collections.synchronizedList(new ArrayList<>()) or CopyOnWriteArrayList','Enumeration (legacy iterator) exposed via elements()','Doubles capacity (wasteful vs ArrayList\'s 1.5x)'],
  qs:[{q:'Vector vs ArrayList?',a:'Vector is synchronized (thread-safe but slow), ArrayList is not. Both are resizable arrays. Prefer ArrayList + explicit sync or ConcurrentLinkedDeque for modern code.'}]
 }
},
{id:'Stack', x:520, y:620, t:'L',
 label:'Stack<E>', pkg:'java.util',
 body:'Legacy LIFO stack. Extends Vector.',
 info:{
  desc:'A LIFO stack extending Vector. All Vector synchronization overhead applies. Peek, pop, push, empty, search.',
  methods:['push(E)','pop() → E','peek() → E','empty() → boolean','search(Object) → int (1-based)'],
  tips:['search() returns 1-based position from top','Prefer ArrayDeque for stacks — faster and not synchronized','Stack extends Vector which extends AbstractList — odd hierarchy','ArrayDeque.push/pop are LIFO equivalent'],
  qs:[{q:'Stack vs Deque as a stack?',a:'Deque (ArrayDeque) is recommended by Java docs. It\'s faster (no sync), less memory, and more flexible. Stack has an awkward inheritance from Vector.'}]
 }
},
{id:'CopyOnWriteArrayList', x:760, y:620, t:'C',
 label:'CopyOnWriteArrayList<E>', pkg:'java.util.concurrent',
 body:'Thread-safe. Copies array on every write.',
 info:{
  desc:'A thread-safe List where every mutating operation (add, set, remove) makes a fresh copy of the underlying array. Readers are never blocked.',
  methods:['add — O(n) — copies full array','get — O(1)','iterator() — snapshot, never throws CME'],
  complexity:[{label:'read O(1)',cls:'good'},{label:'write O(n)',cls:'bad'}],
  tips:['Iterator is a snapshot — won\'t see new elements added after creation','Never throws ConcurrentModificationException','Ideal for listener/observer lists (rare writes, frequent reads)','Writes hold ReentrantLock'],
  qs:[{q:'When to use CopyOnWriteArrayList?',a:'When reads vastly outnumber writes (e.g., event listener lists). Each write is O(n) so it\'s inefficient for frequent modifications.'}]
 }
},

// ── SET BRANCH ─────────────────────────────────────────
{id:'Set', x:960, y:150, t:'I',
 label:'Set<E>', pkg:'java.util',
 body:'No duplicates. Models mathematical set.',
 info:{
  desc:'A Collection that forbids duplicate elements. The mathematical set abstraction. No guaranteed order (unless SortedSet/LinkedHashSet).',
  methods:['Inherits all Collection methods','add(E) returns false if element already present'],
  tips:['equals() and hashCode() contract critical for Set behaviour','add() returns boolean — useful to detect duplicates','No positional access (no get(int))'],
  qs:[{q:'How does HashSet prevent duplicates?',a:'It uses HashMap internally. add(e) calls map.put(e, PRESENT). HashMap rejects duplicate keys, so duplicates are naturally prevented.'}]
 }
},
{id:'SortedSet', x:840, y:270, t:'I',
 label:'SortedSet<E>', pkg:'java.util',
 body:'Set with elements in ascending order.',
 info:{
  desc:'A Set maintaining elements in ascending order (natural or Comparator). Enables range operations.',
  methods:['first()','last()','headSet(toE)','tailSet(fromE)','subSet(from,to)','comparator()'],
  tips:['null elements generally not allowed (compare fails)','headSet/tailSet/subSet return views — modifications reflect back','Range views are half-open: [from, to)'],
  qs:[{q:'SortedSet vs NavigableSet?',a:'NavigableSet extends SortedSet adding navigation methods like floor(), ceiling(), higher(), lower() and descending iterators. TreeSet implements NavigableSet.'}]
 }
},
{id:'NavigableSet', x:840, y:390, t:'I',
 label:'NavigableSet<E>', pkg:'java.util',
 body:'SortedSet + floor/ceiling navigation.',
 info:{
  desc:'Extends SortedSet with navigation methods to find closest matches. Also supports descending iteration.',
  methods:['floor(E) — ≤ e','ceiling(E) — ≥ e','lower(E) — < e','higher(E) — > e','pollFirst()','pollLast()','descendingSet()'],
  tips:['All range operations have inclusive/exclusive overloads','descendingSet() returns a reverse-order view','pollFirst/Last remove and return, null if empty'],
  qs:[{q:'floor() vs lower()?',a:'floor(e) returns the greatest element ≤ e (inclusive). lower(e) returns the greatest element strictly < e (exclusive).'}]
 }
},
{id:'AbstractSet', x:1060, y:390, t:'A',
 label:'AbstractSet<E>', pkg:'java.util',
 body:'Skeletal Set impl. Overrides equals/hashCode.',
 info:{
  desc:'Skeletal implementation of Set. Provides equals() and hashCode() based on set contents rather than object identity.',
  methods:['equals() — compares by containsAll both ways','hashCode() — sum of element hashCodes'],
  tips:['removeAll() is overridden here for performance','Two sets are equal if they contain the same elements regardless of type (HashSet vs TreeSet can be equal)'],
  qs:[{q:'Can a HashSet equal a TreeSet?',a:'Yes! AbstractSet.equals() only checks that both sets contain the same elements using containsAll() — it is type-agnostic.'}]
 }
},
{id:'HashSet', x:930, y:510, t:'C',
 label:'HashSet<E>', pkg:'java.util',
 body:'Hash-table backed. O(1) ops. No order.',
 info:{
  desc:'Backed entirely by a HashMap<E, Object>. The element is the key; a shared PRESENT sentinel is the value. Allows one null.',
  methods:['add — O(1) avg','remove — O(1) avg','contains — O(1) avg','Iteration O(n + capacity)'],
  complexity:[{label:'add O(1)*',cls:'good'},{label:'contains O(1)*',cls:'good'},{label:'order: none',cls:'warn'}],
  tips:['Initial capacity + load factor (default 0.75) affect performance','Over 0.75 load → rehashing (expensive O(n))','Allows exactly ONE null element','Iteration order is unpredictable'],
  qs:[
    {q:'How does HashSet use HashMap?',a:'add(e) calls map.put(e, PRESENT). PRESENT is a static final Object. So the set stores elements as HashMap keys.'},
    {q:'Load factor significance?',a:'At load factor 0.75, when 75% full, the table doubles and rehashes. Lower = less collision, more memory. Higher = more collision, less memory.'}
  ]
 }
},
{id:'LinkedHashSet', x:930, y:640, t:'C',
 label:'LinkedHashSet<E>', pkg:'java.util',
 body:'HashSet + insertion-order iteration.',
 info:{
  desc:'A HashSet backed by a LinkedHashMap. Maintains a doubly-linked list through all entries to define insertion-order iteration.',
  complexity:[{label:'add O(1)*',cls:'good'},{label:'order: insertion',cls:'good'}],
  tips:['Slightly slower than HashSet due to linked list maintenance','Only JDK Set with guaranteed insertion-order AND O(1) ops','Perfect when you need uniqueness + predictable iteration order'],
  qs:[{q:'LinkedHashSet vs TreeSet?',a:'LinkedHashSet is O(1) and maintains insertion order. TreeSet is O(log n) and maintains sorted order. Choose based on whether you need natural sorting or insertion order.'}]
 }
},
{id:'TreeSet', x:820, y:640, t:'C',
 label:'TreeSet<E>', pkg:'java.util',
 body:'Sorted NavigableSet. Red-black tree. O(log n).',
 info:{
  desc:'Backed by a TreeMap. Implements NavigableSet and SortedSet. All elements ordered by natural ordering or Comparator. O(log n) for all ops.',
  methods:['All NavigableSet navigation methods','floor, ceiling, higher, lower, pollFirst, pollLast'],
  complexity:[{label:'add O(log n)',cls:'warn'},{label:'contains O(log n)',cls:'warn'},{label:'sorted always',cls:'good'}],
  tips:['No null elements (compareTo/compare would NPE)','Comparator or Comparable must be consistent with equals','Backed by TreeMap — same red-black tree structure','Range views: headSet, tailSet, subSet are O(1) views'],
  qs:[{q:'TreeSet implements which interfaces?',a:'TreeSet implements NavigableSet, SortedSet, Set, and Collection (and Iterable). It does NOT implement List or Queue.'}]
 }
},
{id:'EnumSet', x:1100, y:510, t:'A',
 label:'EnumSet<E>', pkg:'java.util',
 body:'Blazing-fast bit-vector Set for enum types.',
 info:{
  desc:'A specialised Set for use with enum types. Represented internally as a bit vector (long for ≤64 enum values). Extremely compact and fast.',
  methods:['EnumSet.of(e1,e2,…)','EnumSet.allOf(MyEnum.class)','EnumSet.complementOf(enumSet)','EnumSet.range(from,to)'],

// ─── BUILD NODES ─────────────────────────────────────────
const world = document.getElementById('world');
const svg   = document.getElementById('svg-edges');
const kindMap = {I:'«interface»', A:'«abstract»', C:'class', L:'legacy class'};
const nodeEls = {};
const nodePos = {}; // live positions

nodes.forEach(n => {
  const el = document.createElement('div');
  el.className = `node t${n.t}`;
  el.id = `n-${n.id}`;
  el.style.left = n.x + 'px';
  el.style.top  = n.y + 'px';
  el.innerHTML = `
    <div class="node-head">
      <div class="node-kind">${kindMap[n.t]}</div>
      <div class="node-name">${n.label}</div>
      <div class="node-pkg">${n.pkg}</div>
    </div>
    <div class="node-body">${n.body}</div>
  `;
  world.appendChild(el);
  nodeEls[n.id] = el;
  nodePos[n.id] = { x: n.x, y: n.y };

  // Click → info panel
  el.addEventListener('click', e => { e.stopPropagation(); openPanel(n); });

  // Drag
  makeDraggable(el, n.id);
});

// ─── DRAG ────────────────────────────────────────────────
function makeDraggable(el, id) {
  let startX, startY, origX, origY, moved;
  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    startX = e.clientX; startY = e.clientY;
    origX = nodePos[id].x; origY = nodePos[id].y;
    moved = false;
    el.classList.add('dragging');
    const onMove = ev => {
      const dx = (ev.clientX - startX) / scale;
      const dy = (ev.clientY - startY) / scale;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
      nodePos[id].x = origX + dx;
      nodePos[id].y = origY + dy;
      el.style.left = nodePos[id].x + 'px';
      el.style.top  = nodePos[id].y + 'px';
      drawEdges();
    };
    const onUp = ev => {
      el.classList.remove('dragging');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      if (!moved) openPanel(nodes.find(n=>n.id===id));
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}

// ─── DRAW EDGES ──────────────────────────────────────────
function getBounds(id) {
  const el = nodeEls[id];
  const pos = nodePos[id];
  const w = el.offsetWidth  || 180;
  const h = el.offsetHeight || 70;
  return { l:pos.x, t:pos.y, r:pos.x+w, b:pos.y+h, cx:pos.x+w/2, cy:pos.y+h/2, w, h };
}

function drawEdges() {
  svg.querySelectorAll('.edge').forEach(e=>e.remove());
  edges.forEach(ed => {
    if (!nodeEls[ed.f] || !nodeEls[ed.t]) return;
    const f = getBounds(ed.f), t = getBounds(ed.t);
    const isE = ed.r === 'E';
    const col  = isE ? '#ffd166' : '#ff6b9d';
    const dash = isE ? 'none' : '6 3';

    // Pick best edge exit/entry
    const dx = t.cx - f.cx, dy = t.cy - f.cy;
    let fx, fy, tx, ty;
    if (Math.abs(dy) >= Math.abs(dx)) {
      fx = f.cx; fy = dy < 0 ? f.t : f.b;
      tx = t.cx; ty = dy < 0 ? t.b : t.t;
    } else {
      fy = f.cy; fx = dx < 0 ? f.l : f.r;
      ty = t.cy; tx = dx < 0 ? t.r : t.l;
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const midY = (fy + ty) / 2;
    path.setAttribute('d',`M${fx},${fy} C${fx},${midY} ${tx},${midY} ${tx},${ty}`);
    path.setAttribute('stroke', col);
    path.setAttribute('stroke-width', '1.4');
    path.setAttribute('fill','none');
    path.setAttribute('stroke-dasharray', dash);
    path.setAttribute('opacity','0.5');
    path.setAttribute('marker-end',`url(#arr-${ed.r})`);
    path.classList.add('edge');
    svg.appendChild(path);
  });
}
requestAnimationFrame(()=>requestAnimationFrame(drawEdges));

// ─── CANVAS PAN + ZOOM ───────────────────────────────────
let scale = 0.52, panX = 40, panY = 20;
let panning = false, px = 0, py = 0;

function applyT() {
  world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
}
applyT();

const wrap = document.getElementById('wrap');
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  panning = true; px = e.clientX; py = e.clientY;
  wrap.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!panning) return;
  panX += e.clientX - px; panY += e.clientY - py;
  px = e.clientX; py = e.clientY; applyT();
});
window.addEventListener('mouseup', () => { panning = false; wrap.classList.remove('panning'); });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.91;
  const r = wrap.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  panX = ox - (ox - panX) * f;
  panY = oy - (oy - panY) * f;
  scale = Math.min(3, Math.max(0.1, scale * f));
  applyT();
}, {passive:false});

function resetView() { scale=0.52; panX=40; panY=20; applyT(); }
function doZoom(f)   { scale=Math.min(3,Math.max(0.1,scale*f)); applyT(); }

// Close panel when clicking canvas
wrap.addEventListener('click', () => closePanel());

// ─── INFO PANEL ──────────────────────────────────────────
const panel = document.getElementById('info-panel');
const colMap = { I:'var(--I)', A:'var(--A)', C:'var(--C)', L:'var(--L)' };

function openPanel(n) {
  const d = n.info;
  const colStyle = `color:${colMap[n.t]}`;
  let html = `<h2 style="${colStyle}">${n.label}</h2>`;
  html += `<div class="pkg">${n.pkg} &nbsp;·&nbsp; ${kindMap[n.t]}</div>`;

  html += `<div class="info-section"><h3>Description</h3><p>${d.desc}</p></div>`;

  if (d.methods && d.methods.length) {
    html += `<div class="info-section"><h3>Key Methods / Complexity</h3><ul>`;
    d.methods.forEach(m => html += `<li><code>${m}</code></li>`);
    html += `</ul>`;
    if (d.complexity && d.complexity.length) {
      html += `<div class="complexity-row">`;
      d.complexity.forEach(c => html += `<span class="chip ${c.cls||''}">${c.label}</span>`);
      html += `</div>`;
    }
    html += `</div>`;
  } else if (d.complexity && d.complexity.length) {
    html += `<div class="info-section"><h3>Complexity</h3><div class="complexity-row">`;
    d.complexity.forEach(c => html += `<span class="chip ${c.cls||''}">${c.label}</span>`);
    html += `</div></div>`;
  }

  if (d.tips && d.tips.length) {
    html += `<div class="info-section"><h3>⚡ Key Points to Remember</h3><ul>`;
    d.tips.forEach(t => html += `<li>${t}</li>`);
    html += `</ul></div>`;
  }

  // Relations
  const ext = edges.filter(e=>e.f===n.id&&e.r==='E').map(e=>e.t);
  const imp = edges.filter(e=>e.f===n.id&&e.r==='I').map(e=>e.t);
  const extBy = edges.filter(e=>e.t===n.id&&e.r==='E').map(e=>e.f);
  const impBy = edges.filter(e=>e.t===n.id&&e.r==='I').map(e=>e.f);
  let relHtml = '';
  if(ext.length)   relHtml += `<div><span style="color:var(--ext)">extends →</span> ${ext.join(', ')}</div>`;
  if(imp.length)   relHtml += `<div><span style="color:var(--imp)">implements →</span> ${imp.join(', ')}</div>`;
  if(extBy.length) relHtml += `<div><span style="color:var(--muted)">extended by ←</span> ${extBy.join(', ')}</div>`;
  if(impBy.length) relHtml += `<div><span style="color:var(--muted)">implemented by ←</span> ${impBy.slice(0,6).join(', ')}${impBy.length>6?'…':''}</div>`;
  if(relHtml) html += `<div class="info-section"><h3>Relationships</h3>${relHtml}</div>`;

  if (d.qs && d.qs.length) {
    html += `<div class="info-section"><h3>🎯 Interview Questions</h3>`;
    d.qs.forEach(q => {
      html += `<div class="interview-q">
        <div class="qlabel">Q</div>
        <p><strong style="color:var(--text)">${q.q}</strong></p>
        <p style="margin-top:5px">${q.a}</p>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('panel-content').innerHTML = html;
  panel.classList.add('open');
}

function closePanel() {
  panel.classList.remove('open');
}
